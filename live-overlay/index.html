<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Avatar Ranked — Live Overlay</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div class="stage" id="stage" data-align="left" data-bg="transparent">
    <main class="board" aria-label="Bảng xếp hạng live Avatar Ranked">
      <header class="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true">AR</span>
          <div class="brand-copy">
            <p class="brand-name">Avatar Ranked</p>
            <p class="brand-sub">Roast · Rate · Rank</p>
          </div>
        </div>

        <div class="status" id="status" data-status="loading" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-label">Đang nối</span>
        </div>
      </header>

      <div class="headline">
        <div class="headline-copy">
          <p class="kicker">Hall of drip · Live</p>
          <h1>Bảng <span class="grad">xếp hạng</span></h1>
        </div>

        <div class="total">
          <p class="total-num" id="total">00</p>
          <p class="total-label">Avatar</p>
        </div>
      </div>

      <div class="body">
        <div class="empty" id="empty" hidden>
          <span class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 21h8" />
              <path d="M12 17v4" />
              <path d="M7 4h10v5a5 5 0 0 1-10 0V4Z" />
              <path d="M7 6H4v2a3 3 0 0 0 3 3" />
              <path d="M17 6h3v2a3 3 0 0 1-3 3" />
            </svg>
          </span>
          <p class="empty-title">Đang chờ lượt quét đầu tiên</p>
          <p class="empty-copy">Quét avatar trên website — bảng live sẽ tự cập nhật tại đây.</p>
        </div>

        <ol class="rows" id="rows" aria-label="Bảng xếp hạng live"></ol>
      </div>

      <div class="progress" id="progress" hidden aria-hidden="true">
        <span class="progress-bar" id="progress-bar"></span>
      </div>

      <footer class="foot">
        <p class="foot-range" id="range">Chưa có dữ liệu</p>
        <div class="dots" id="dots" role="group" aria-label="Chọn trang"></div>
        <p class="foot-page" id="page-info">Tự động cập nhật</p>
      </footer>

      <div class="offline" id="offline" hidden role="status">
        Mất kết nối tới server — đang thử lại…
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
