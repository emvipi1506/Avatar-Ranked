<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" role="img" aria-labelledby="title desc">
  <title id="title">Blocky Roblox-style avatar minh họa</title>
  <desc id="desc">Nhân vật blocky đội tóc nâu, kính đen, áo xanh và quần xanh lá.</desc>
  <g stroke="#111111" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- neck -->
    <rect x="104" y="106" width="32" height="22" fill="#f5cd30" />
    <!-- legs -->
    <rect x="72" y="242" width="38" height="62" fill="#4b974b" />
    <rect x="130" y="242" width="38" height="62" fill="#4b974b" />
    <!-- torso -->
    <rect x="58" y="126" width="124" height="118" rx="10" fill="#0d69ac" />
    <!-- arms -->
    <rect x="26" y="132" width="32" height="104" rx="8" fill="#f5cd30" />
    <rect x="182" y="132" width="32" height="104" rx="8" fill="#f5cd30" />
    <!-- hands -->
    <circle cx="42" cy="238" r="14" fill="#f5cd30" />
    <circle cx="198" cy="238" r="14" fill="#f5cd30" />
    <!-- head -->
    <rect x="66" y="34" width="108" height="86" rx="12" fill="#f5cd30" />
    <!-- hair -->
    <path d="M64 54c0-18 16-30 40-30h32c24 0 40 12 40 30v10c-8-8-18-12-32-12h-48c-14 0-24 4-32 12z" fill="#6b4226" />
    <!-- sunglasses -->
    <rect x="78" y="66" width="38" height="22" rx="4" fill="#111111" />
    <rect x="124" y="66" width="38" height="22" rx="4" fill="#111111" />
    <rect x="114" y="73" width="12" height="5" fill="#111111" stroke="none" />
    <!-- smile -->
    <path d="M100 92c8 8 28 8 40 0" fill="none" stroke-width="4" />
    <!-- shirt detail -->
    <path d="M86 132v40l34 20 34-20v-40" fill="none" stroke="#7fe3ff" stroke-width="4" />
    <!-- shoe highlights -->
    <path d="M72 304h38M130 304h38" fill="none" />
  </g>
</svg>
